<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a192f"/>
      <stop offset="100%" style="stop-color:#172a45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg4)"/>
  <!-- Radar circles -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.2"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="256" cy="240" r="70" fill="none" stroke="#4da6ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Radar sweep -->
  <path d="M256 240 L256 90 A150 150 0 0 1 386 165 Z" fill="#4da6ff" opacity="0.1"/>
  <!-- Center dot -->
  <circle cx="256" cy="240" r="8" fill="#4da6ff"/>
  <!-- Detected endpoint dots -->
  <circle cx="310" cy="170" r="8" fill="#51cf66">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="200" r="8" fill="#ff6b6b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="280" r="8" fill="#ffd43b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="310" r="8" fill="#51cf66">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="340" r="8" fill="#ff6b6b">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Large curly braces framing -->
  <text x="100" y="275" font-family="monospace" font-size="120" fill="#4da6ff" opacity="0.3">{</text>
  <text x="360" y="275" font-family="monospace" font-size="120" fill="#4da6ff" opacity="0.3">}</text>
  <!-- Bottom text -->
  <text x="256" y="440" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="32" fill="#ffffff" opacity="0.85">API RADAR</text>
</svg>
