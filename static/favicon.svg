      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1b2d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg1)"/>
  <!-- Spider body (crawler) -->
  <ellipse cx="256" cy="240" rx="45" ry="35" fill="#4da6ff" opacity="0.9"/>
  <circle cx="256" cy="210" r="25" fill="#4da6ff" opacity="0.9"/>
