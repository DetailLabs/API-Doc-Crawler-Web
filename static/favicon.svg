  <line x1="211" y1="245" x2="120" y2="260" stroke="#4da6ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="215" y1="260" x2="140" y2="330" stroke="#4da6ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="301" y1="230" x2="382" y2="170" stroke="#4da6ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="301" y1="245" x2="392" y2="260" stroke="#4da6ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="297" y1="260" x2="372" y2="330" stroke="#4da6ff" stroke-width="4" stroke-linecap="round"/>
  <!-- API endpoint nodes -->
  <circle cx="130" cy="170" r="12" fill="#ff6b6b"/>
  <circle cx="120" cy="260" r="12" fill="#51cf66"/>
  <circle cx="140" cy="330" r="12" fill="#ffd43b"/>
